<!DOCTYPE html>

  <meta name="description" content="Repmesi の概要。GitHub Pages で公開する複数ページの静的サイトです。">
  <link rel="stylesheet" href="../css/style.css">

<body>
  <div class="wrap">
    <header class="site-header">
      <a class="wordmark" href="../">Repmesi</a>
      <nav aria-label="主要">
        <a href="../">ホーム</a>
        <a href="./" aria-current="page">概要</a>
        <a href="../contact/">連絡</a>
      </nav>
    </header>
    <main>
      <p class="kicker">About</p>
      <h1>概要</h1>
      <p>Repmesi は、GitHub Pages のプロジェクトサイトとして公開する静的サイトです。リポジトリの説明にある Desmesi を、サイトの副題にしています。</p>
      <p>ページは三枚です。ホーム、この概要、そして連絡。見た目はひとつのスタイルシートにまとめ、ページ同士は相対パスでつないでいます。プロジェクトサイトのパス（<span lang="en">/Repmesi/</span>）の下でも、同じリンクがそのまま動きます。</p>
      <p>中身は HTML と CSS だけです。生成ステップも、外部のフレームワークも入れていません。</p>
    </main>
    <footer>
      <p>Repmesi · Desmesi</p>
    </footer>
  </div>
</body>
</html>
